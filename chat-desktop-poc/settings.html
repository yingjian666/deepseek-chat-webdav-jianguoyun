<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>设置</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 24px 26px;
        font: 14px/1.6 system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .sub {
        margin: 0 0 16px;
        color: #6b7280;
        font-size: 12.5px;
      }
      section {
        padding: 14px 0 6px;
        border-top: 1px solid #e5e7eb;
      }
      section:first-of-type {
        border-top: none;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 700;
        color: #374151;
      }
      label {
        display: block;
        margin: 10px 0 6px;
        font-weight: 600;
        font-size: 13px;
      }
      input[type='email'],
      input[type='password'],
      select {
        width: 100%;
        padding: 8px 11px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      }
      .hint {
        margin-top: 5px;
        font-size: 12px;
        color: #6b7280;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        padding: 9px 20px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        font-size: 12.5px;
        color: #059669;
      }
      .warn {
        color: #b45309;
      }
    </style>
  </head>
  <body>
    <h2>设置</h2>
    <p class="sub">凭据使用系统加密保存；以下选项只影响本机。</p>

    <section>
      <h3>坚果云账号</h3>
      <p class="sub" style="margin-bottom: 8px">用于同步对话历史，走 WebDAV，不经过第三方服务器。</p>
      <label for="user">邮箱</label>
      <input id="user" type="email" autocomplete="off" placeholder="坚果云登录邮箱" />

      <label for="pass">应用密码</label>
      <input id="pass" type="password" autocomplete="off" placeholder="留空表示不修改" />
      <div class="hint">不是登录密码。坚果云「安全选项 → 第三方应用管理」生成。</div>
    </section>

    <section>
      <h3>界面缩放</h3>
      <label for="zoom">整体大小</label>
      <select id="zoom">
        <option value="0.8">80%</option>
        <option value="0.9">90%</option>
        <option value="1">100%（标准）</option>
        <option value="1.1">110%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
      </select>
      <div class="hint">影响整个界面。对话正文单独调：聊天窗口 → 设置 → 通用设置 → 对话字号。</div>
    </section>

    <div class="row">
      <button id="save">保存</button>
      <span id="status" class="status"></span>
    </div>

    <script>
      const bridge = window.__settingsBridge
      const $ = (id) => document.getElementById(id)

      bridge.load().then((data) => {
        $('user').value = data.user || ''
        $('pass').placeholder = data.hasPass ? '已保存（留空不修改）' : '应用密码'
        const zoom = String(data.zoomFactor || 1)
        const option = Array.from($('zoom').options).find((item) => item.value === zoom)
        if (option) $('zoom').value = zoom
        if (!data.canEncrypt) {
          $('status').textContent = '系统加密不可用，凭据无法保存'
          $('status').className = 'status warn'
        }
      })

      $('zoom').addEventListener('change', async () => {
        try {
          await bridge.save({ zoomFactor: Number($('zoom').value) })
          $('status').textContent = '缩放已应用'
          $('status').className = 'status'
        } catch (error) {
          $('status').textContent = '缩放应用失败：' + (error && error.message ? error.message : String(error))
          $('status').className = 'status warn'
        }
      })

      $('save').addEventListener('click', async () => {
        $('save').disabled = true
        $('status').textContent = '保存中…'
        $('status').className = 'status'
        try {
          await bridge.save({
            user: $('user').value,
            pass: $('pass').value,
            zoomFactor: Number($('zoom').value),
          })
          $('status').textContent = '已保存'
        } catch (error) {
          $('status').textContent = '保存失败：' + (error && error.message ? error.message : String(error))
          $('status').className = 'status warn'
        } finally {
          $('save').disabled = false
        }
      })
    </script>
  </body>
</html>
